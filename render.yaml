# Render Blueprint: https://render.com/docs/blueprint-spec
# Render → New → Blueprint → pick this repo. It asks for the two secret values below.
services:
  - type: web
    name: vaani
    runtime: docker
    plan: free
    region: singapore          # closest Render region to India; create the Neon DB in AWS Singapore too
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL      # Neon connection string (postgresql://...?sslmode=require)
        sync: false
      - key: GEMINI_API_KEY    # https://aistudio.google.com/apikey
        sync: false
      - key: STT_PROVIDER
        value: gemini
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.5-transcribe-live
      - key: GEMINI_TRANSCRIPTION_MODE
        value: VERBATIM
