name: vaani

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vaani
      POSTGRES_PASSWORD: vaani
      POSTGRES_DB: vaani
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaani -d vaani"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Optional: run the whole app in Docker with `docker compose --profile app up --build`.
  # Includes the self-hosted models; download them first with scripts/download_models.py.
  app:
    profiles: ["app"]
    build:
      context: .
      args:
        REQUIREMENTS: requirements-local.txt
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://vaani:vaani@db:5432/vaani
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
